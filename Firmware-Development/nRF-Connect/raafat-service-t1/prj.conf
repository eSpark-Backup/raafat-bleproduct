CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Raafat_BLE"
CONFIG_BT_SMP=y

# Enable the LBS service
# CONFIG_BT_LBS=y
# CONFIG_BT_RAAFAT_POLL_ANALOG=y
# CONFIG_DK_LIBRARY=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

#logging
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_PRINTK=y

#clock configurations
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=0

CONFIG_GPIO=y

#Raafat BLE Service Configurations
CONFIG_BT_RAAFAT_LOG_LEVEL=4
CONFIG_BT_RAAFAT_POLL_ANALOG=y
CONFIG_BT_RAAFAT_SECURITY_ENABLED=y

#Raafat JSON packet configurations
CONFIG_BT_RAAFAT_ENABLE_ACCEL_PACKET=y
CONFIG_BT_RAAFAT_ENABLE_GYRO_PACKET=y
CONFIG_BT_RAAFAT_ENABLE_MAGN_PACKET=y
CONFIG_BT_RAAFAT_ENABLE_NOTIFY=n
CONFIG_RAAFAT_SERVICE_UPDATE_INTERVAL_SEC=1

#Configure NFC Pins as GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

#Adc enable
CONFIG_ADC=y

#fixes sprint and log error for float, but does not compile
# CONFIG_NEWLIB_LIBC=y
# CONFIG_NEWLIB_LIBC_NANO=n
# CONFIG_NEWLIB_LIBC_SUPPORTED=y
# CONFIG_NEWLIB_LIBC=y 
# CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_BOARD_NRF52DK_NRF52832=y
# CONFIG_BUILD_OUTPUT_UF2=y
# CONFIG_USE_DT_CODE_PARTITION=y
# CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="0x72721d4e"

CONFIG_BOARD_ENABLE_DCDC=n

#i2c Config and sensor
CONFIG_I2C=y
CONFIG_SENSOR=y


#RGB Config
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_PRINTK=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y

CONFIG_NRFX_PPI=y
# This driver only uses spi_write() with the SPIM instance it allocates,
# so PAN 58 doesn't matter, because the RX length is always 0.
CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=y
